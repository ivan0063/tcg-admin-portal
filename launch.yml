# launch.yml - tcg-admin-portal
# Only what differs from the pipeline convention: app name, port 8080, TZ,
# prod from main and OpenBao secrets at <environment>/tcg-admin-portal.
profile: spring-boot
host: tcg                        # tcg.lab.home.arpa once local DNS exists
env:
  JPA_DDL_AUTO: update
  H2_CONSOLE_ENABLED: "false"    # the app leaves it on by default

environments:
  preview:
    env:
      LOG_LEVEL: DEBUG
